#
# Release overlay, merged on top of prj.conf via EXTRA_CONF_FILE.
#   west build --no-sysbuild -b xiao_ble application -- -DEXTRA_CONF_FILE=overlay-release.conf

# Disable USB device stack, the nRF52840 USB peripheral draws ~1mA+ even
# with no cable connected. This also disables the CDC ACM serial console.
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

# Disable serial console and shell, these keep the CPU and UART clocked,
# wasting power.
# Note: CONFIG_SERIAL must stay enabled for the sensor UART (uart0).
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SHELL=n
CONFIG_OPENTHREAD_SHELL=n
CONFIG_CHIP_LIB_SHELL=n
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=n

# Disable logging and boot output
CONFIG_LOG=n
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n

# Power down unused RAM blocks to reduce idle current
CONFIG_RAM_POWER_DOWN_LIBRARY=y
